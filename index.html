<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gợi Ý Số Vietlott Thông Minh - 200 Kỳ Gần Nhất</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .ball {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .ball-mega { background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b); }
    .ball-power { background: radial-gradient(circle at 30% 30%, #f59e0b, #b45309); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-500">
        VIETLOTT STATS & AI SUGGESTION
      </h1>
      <p class="text-slate-400 mt-2 text-sm sm:text-base">
        Phân tích thống kê & Tối ưu hóa xác suất dựa trên lịch sử mở thưởng
      </p>

      <!-- Thanh trạng thái và nút cập nhật -->
      <div class="flex flex-wrap items-center justify-center gap-3 mt-4">
        <div id="data-status" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Đang nạp dữ liệu...
        </div>
        
        <!-- Nút làm mới dữ liệu ép buộc bỏ cache -->
        <button onclick="reloadData(true)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition active:scale-95">
          <i id="sync-icon" class="fa-solid fa-rotate"></i> Làm mới dữ liệu
        </button>
      </div>
    </header>

    <!-- Chọn Game -->
    <div class="flex justify-center gap-4 mb-8">
      <button id="btn-tab-mega" onclick="switchGame('mega645')" class="px-6 py-2.5 rounded-xl font-bold transition flex items-center gap-2 bg-red-600 text-white shadow-lg shadow-red-600/30">
        <i class="fa-solid fa-fire"></i> Mega 6/45
      </button>
      <button id="btn-tab-power" onclick="switchGame('power655')" class="px-6 py-2.5 rounded-xl font-bold transition flex items-center gap-2 bg-slate-800 text-slate-300 hover:bg-slate-700">
        <i class="fa-solid fa-bolt"></i> Power 6/55
      </button>
    </div>

    <!-- Khung chính -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      
      <!-- Cột gợi ý số -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Bộ Số Gợi Ý Tối Ưu
          </h2>
          
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
            <label class="cursor-pointer">
              <input type="radio" name="strategy" value="balanced" checked class="peer sr-only">
              <div class="p-3 rounded-xl border border-slate-700 peer-checked:border-red-500 peer-checked:bg-red-500/10 text-center transition">
                <div class="font-bold text-sm text-slate-200">Cân Bằng Chuẩn</div>
                <div class="text-xs text-slate-400 mt-1">Chẵn/Lẻ 3:3, Tổng chuẩn</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="strategy" value="hot" class="peer sr-only">
              <div class="p-3 rounded-xl border border-slate-700 peer-checked:border-red-500 peer-checked:bg-red-500/10 text-center transition">
                <div class="font-bold text-sm text-slate-200">Bắt Cầu Nóng</div>
                <div class="text-
