name: Vietlott Daily Auto Update

on:
  schedule:
    # 19:30 giờ Việt Nam (UTC+7) = 12:30 UTC, chạy sau giờ quay 18:00-18:30
    - cron: '30 12 * * *'
    # Chạy lại lúc 21:30 giờ VN (14:30 UTC) phòng khi trang nguồn cập nhật chậm; không có thay đổi thì không commit
    - cron: '30 14 * * *'
  workflow_dispatch: # Cho phép chạy tay

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and Push Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi dữ liệu."
          else
            git commit -m "Auto update Vietlott draws [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
