name: Vietlott Daily Auto Update

on:
  schedule:
    # 19:15 Giờ Việt Nam (UTC+7) -> 12:15 UTC (chạy sau giờ quay 18:30)
    - cron: '30 12 * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy tay bất cứ lúc nào

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update 200 recent Vietlott draws [skip ci]" && git push)
